# Stack: backend + front (Caddy sirve el SPA y proxea /api, /glyphs,
# /materiales al backend — un solo origen público, sin CORS). Postgres
# NO corre acá: el backend se conecta al Supabase self-hosted de
# "ecodatos" (mismo servidor físico, otra VM), schema propio
# `alerta_temprana` — ver DATABASE_URL abajo. Copiá `.env.example` a
# `.env` y ajustá antes de levantar.
services:
  backend:
    build: ./mapa-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      TRUST_PROXY: "1"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL en .env (Supabase de ecodatos)}
      # El Postgres de ecodatos no tiene TLS habilitado — ver store.js.
      DATABASE_SSL: ${DATABASE_SSL:-false}
      # Placas (feed + historias) al bucket de Supabase Storage de ecodatos.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Todo entra por el mismo origen (Caddy), así que no hace falta
      # restringir CORS acá; si igual querés pegarle directo al backend
      # desde otro origen, poné la URL en CORS_ORIGIN.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Token fijo que manda el sistema de alertas en X-Api-Key al pegarle
      # al webhook de incendios — ver .env.example.
      ALERTAS_INCENDIOS_TOKEN: ${ALERTAS_INCENDIOS_TOKEN:-}
      SMN_SCOPE: ${SMN_SCOPE:-misiones}
      # Publicación de placas en redes desde el panel — ver docs/redes-sociales.md.
      # Sin estas variables el destino aparece como "sin configurar".
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WHATSAPP_NUMERO: ${WHATSAPP_NUMERO:-}
      # Envío del pronóstico por correo desde la casilla de Microsoft 365 —
      # ver docs/correo.md. Sin estas variables el envío avisa que falta configurarlo.
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Control del servicio de transmisión a YouTube (red interna de docker).
      TRANSMISION_TOKEN: ${TRANSMISION_TOKEN:-}
      TRANSMISION_CONTROL_URL: ${TRANSMISION_CONTROL_URL:-http://transmision:8090}
    volumes:
      # Token JWT del SMN (lib/smn/token.mjs) — sin este volumen, cada
      # redeploy fuerza abrir Chromium de nuevo para renovarlo.
      - smn_token:/app/data/smn
    ports:
      # Puerto directo al backend, sin pasar por Caddy/el dominio público —
      # para que el sistema de alertas de incendios (otro docker compose en
      # esta misma VM) le pegue a POST /api/incendios/webhook internamente,
      # llamando a la IP interna de la VM (no localhost: eso adentro del
      # OTRO contenedor sería su propio loopback, no el de esta VM).
      # Exponé este puerto solo en la red interna del Ministerio, nunca al
      # dominio/internet público — no tiene TLS ni pasa por el proxy.
      - "${INCENDIOS_WEBHOOK_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Transmisión 24/7 de la página /tv (YouTube, Facebook u otros con RTMP), sin OBS: pantalla virtual + Chromium
  # + ffmpeg (ver docs/transmision.md). Queda en espera hasta que se la inicia desde
  # el panel (Configuración → Transmisión); el control (puerto 8090) sólo es visible
  # dentro de esta red de docker, para el backend. No publica puertos.
  transmision:
    build: ./transmision
    restart: unless-stopped
    # Un init de verdad como PID 1: recolecta los procesos zombie de Chromium (chrome_crashpad).
    init: true
    environment:
      TRANSMISION_TOKEN: ${TRANSMISION_TOKEN:-}
      # Destinos: sólo se ofrecen los que tienen clave. Ver docs/transmision.md.
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:-}
      YOUTUBE_RTMP_URL: ${YOUTUBE_RTMP_URL:-rtmp://a.rtmp.youtube.com/live2}
      # Facebook automático: con el token de la página (el de publicar placas) el vivo se
      # crea por la API, sale al aire solo y se renueva antes del límite de 8 h de Facebook.
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      FACEBOOK_AUTOMATICO: ${FACEBOOK_AUTOMATICO:-true}
      FACEBOOK_HORAS_POR_VIVO: ${FACEBOOK_HORAS_POR_VIVO:-7.75}
      TRANSMISION_TITULO: ${TRANSMISION_TITULO:-}
      TRANSMISION_DESCRIPCION: ${TRANSMISION_DESCRIPCION:-}
      # Modo manual de Facebook (sólo si FACEBOOK_AUTOMATICO=false): clave de Live Producer.
      FACEBOOK_STREAM_KEY: ${FACEBOOK_STREAM_KEY:-}
      FACEBOOK_RTMP_URL: ${FACEBOOK_RTMP_URL:-rtmps://live-api-s.facebook.com:443/rtmp}
      TRANSMISION_OTROS: ${TRANSMISION_OTROS:-}
      # La página se pide adentro de docker, al Caddy del frontend (no por el dominio público).
      TRANSMISION_URL: ${TRANSMISION_URL:-http://frontend/tv}
      TRANSMISION_SALIDA: ${TRANSMISION_SALIDA:-1280x720}
      TRANSMISION_FPS: ${TRANSMISION_FPS:-25}
      TRANSMISION_BITRATE: ${TRANSMISION_BITRATE:-3000k}
    # Chromium necesita más memoria compartida que los 64 MB de docker por defecto.
    shm_size: "1gb"
    volumes:
      - transmision_datos:/data
    depends_on:
      - frontend

  frontend:
    build:
      context: ./mapa-frontend
      args:
        # Vacío = pedir todo relativo al mismo origen (ver Caddyfile).
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  smn_token:
  transmision_datos:
