<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf4eb" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      try {
        const saved = localStorage.getItem("ecologia-theme-v1");
        const dark = !["/embed/pronostico-3-dias", "/embed/cuencas-tarjetas", "/embed/cuencas-mapa"].includes(location.pathname.replace(/\/$/, "")) &&
          (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#17251e" : "#faf4eb";
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>Sistema integrado - Alerta Temprana Misiones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
