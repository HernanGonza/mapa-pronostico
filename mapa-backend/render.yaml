# Blueprint de Render para el backend.
# En Render: New + → "Blueprint" → apuntar a este repo.
# (o crear un "Web Service" a mano con estos mismos valores)
services:
  - type: web
    name: mapa-pronostico-backend
    runtime: node
    rootDir: mapa-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # canvas@2.11 tiene binarios precompilados hasta Node 18 — con 20+
      # intenta compilar y necesita Cairo en el sistema.
      - key: NODE_VERSION
        value: "18"
      # Origen permitido para CORS. Poné acá la URL del front en Vercel
      # una vez que exista (ej: https://mapa-pronostico.vercel.app).
      - key: CORS_ORIGIN
        sync: false
    # OJO: el plan free NO permite disco persistente. El pronóstico
    # publicado (data/store/) se borra en cada deploy/reinicio — hay que
    # volver a publicar desde /admin. Para producción, subir de plan y
    # agregar un disk en /opt/render/project/src/mapa-backend/data/store.
